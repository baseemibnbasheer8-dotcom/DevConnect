---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts["os_family"] == "Debian"

- name: Install common packages on CentOS
  ansible.builtin.dnf:
    name:
      - curl
      - git
      - acl
    state: present
  when: ansible_facts["os_family"] == "RedHat"

- name: Install common packages on ubuntu
  ansible.builtin.apt:
    name:
      - curl
      - git
      - acl
    state: present
  when: ansible_facts["os_family"] == "Debian"
